services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: support_pilot
      POSTGRES_USER: support_pilot
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_pilot -d support_pilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - support_pilot_postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - support_pilot_qdrant:/qdrant/storage

volumes:
  support_pilot_postgres:
  support_pilot_qdrant:

