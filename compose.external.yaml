services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd -advertise-client-urls=http://milvus-etcd:2379
      -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - milvus_etcd_data:/etcd
    restart: unless-stopped

  milvus-minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - milvus_minio_data:/minio_data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.24
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_REGION: us-east-1
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

  external-indexer:
    image: knowledge-studio-ai-service:latest
    command: ["uv", "run", "--no-sync", "support-pilot-sync-external"]
    environment:
      PROJECT_ROOT: /app
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: knowledge_studio_chunks
      MILVUS_URL: http://milvus:19530
      MILVUS_COLLECTION: knowledge_studio_chunks
      MILVUS_TOKEN: root:Milvus
      HF_HOME: /var/cache/huggingface
    depends_on:
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - ./data/processed:/app/data/processed:ro
      - huggingface_cache:/var/cache/huggingface
    restart: "no"

  ai-service:
    environment:
      RETRIEVAL_MODE: external
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: knowledge_studio_chunks
      ELASTICSEARCH_API_KEY: ""
      MILVUS_URL: http://milvus:19530
      MILVUS_COLLECTION: knowledge_studio_chunks
      MILVUS_TOKEN: root:Milvus
    depends_on:
      external-indexer:
        condition: service_completed_successfully

volumes:
  elasticsearch_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
